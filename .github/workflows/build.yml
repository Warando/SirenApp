name: iOS Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: List schemes (debug)
        run: xcodebuild -project SirenApp/SirenApp.xcodeproj -list

      - name: Detect scheme
        id: scheme
        run: |
          SCHEME=$(xcodebuild -project SirenApp/SirenApp.xcodeproj -list | \
            awk '/Schemes:/{flag=1; next} flag && NF{print; exit}' | \
            sed 's/^[ \t]*//')
          echo "Найдена схема: $SCHEME"
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: |
          xcodebuild \
            -project SirenApp/SirenApp.xcodeproj \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products -maxdepth 1 -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r SirenApp.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SirenApp
          path: SirenApp.ipa
