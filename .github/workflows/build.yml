name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build app
        run: |
          xcodebuild \
            -project SirenApp.xcodeproj \
            -scheme SirenApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            build

      - name: Create .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SirenApp.app Payload/
          zip -r SirenApp.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SirenApp
          path: SirenApp.ipa
