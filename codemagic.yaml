workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.arahmedovalbert.SirenApp
      vars:
        XCODE_PROJECT: "SirenApp.xcodeproj"
        XCODE_SCHEME: "SirenApp"
      xcode: latest
    scripts:
      - name: Build app
        script: |
          # Собираем приложение (даже если подпись не удалась)
          xcode-project build \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --skip-signing || true
          
          # Принудительно копируем собранное приложение в папку для артефактов
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/Build/Products/Debug-iphoneos/SirenApp.app build/ios/ipa/Payload/ || true
    artifacts:
      - build/ios/ipa/Payload/
