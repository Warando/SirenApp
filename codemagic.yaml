workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.arahmedovalbert.SirenApp
      vars:
        XCODE_PROJECT: "SirenApp.xcodeproj"
        XCODE_SCHEME: "SirenApp"
      xcode: latest
    scripts:
      - name: Build app
        script: |
          xcode-project build \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
